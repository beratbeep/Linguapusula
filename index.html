<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lingua Pusula | Mesleki Dil Öğrenme</title>
<meta name="description" content="Lingua Pusula ile dil öğrenimini mesleki alanınla birleştir. Beta sürümünü keşfet.">
<meta name="theme-color" content="#344E9C">
<meta property="og:title" content="Lingua Pusula">
<meta property="og:description" content="Speak your field — mesleki odaklı dil öğrenme deneyimi.">
<meta property="og:type" content="website">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--sf:#fff;--ink:#0C1F46;--mute:#4F5F85;--line:#D8DFEF;--ac:#344E9C;--bl:#344E9C;--on:#fff;--pw:#E6EBF8;--tint:#F1F4FC;--sun:#6C8CE8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root[data-theme="system"]{--bg:#0A1226;--sf:#111C38;--ink:#E8EDFA;--mute:#9AA9CC;--line:#24325A;--ac:#8FA8F0;--pw:#24325A;--tint:#16264A}}
:root[data-theme="dark"]{--bg:#0A1226;--sf:#111C38;--ink:#E8EDFA;--mute:#9AA9CC;--line:#24325A;--ac:#8FA8F0;--pw:#24325A;--tint:#16264A}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 Poppins,system-ui,sans-serif;padding-bottom:96px;overflow-x:hidden}
h1,h2,h3{font-family:Montserrat,system-ui,sans-serif;margin:0;line-height:1.2}
main{max-width:640px;margin:0 auto;padding:0 16px}
.hero{position:relative;overflow:hidden;padding:28px 0 14px}
.hero i{position:absolute;border-radius:50%;border:18px solid var(--bl);pointer-events:none}
.hero .r1{width:130px;height:130px;top:-70px;right:-50px}
.hero .r2{width:96px;height:96px;border-width:14px;left:-66px;bottom:-34px}
.hero>*{position:relative}
.logo{width:104px;color:var(--ac);display:block}
h1{font-weight:300;font-size:42px;letter-spacing:-1px;margin-top:16px}
.sub{color:var(--mute);font-size:14px;margin:2px 0 0}
.tg{font-size:19px;margin:0}
.beta{font:600 12px Poppins;background:var(--tint);color:var(--ac);border-radius:99px;padding:2px 10px;margin-left:8px;vertical-align:middle}
h2{font-weight:700;font-size:23px;margin:26px 0 12px}
.lb{font-weight:600;font-size:13px;color:var(--mute);margin:12px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:600 13px Poppins;border:2px solid var(--bl);background:var(--sf);color:var(--ink);padding:5px 14px;border-radius:99px;cursor:pointer}
.chip.on{background:var(--bl);color:var(--on)}
.card{background:var(--sf);border:1.5px solid var(--line);border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:0 8px 16px -12px rgba(12,31,70,.35)}
.card h3{font-size:17px;font-weight:700;color:var(--ac)}
.card p{margin:8px 0 0}
.best{background:var(--bl);color:var(--on);border-color:var(--bl)}.blue{background:var(--tint);border-color:var(--tint)}
.best h3{color:var(--on)}
.best .meta,.best .lb{color:#DCE4FA}
.best .btn{border-color:var(--on);color:var(--on)}
.pill{background:linear-gradient(90deg,#0A5FB0,#023B7C);border-radius:22px;padding:8px 16px;display:inline-block;margin-bottom:6px}
.tag{background:#fff;color:#344E9C;font:700 12px Poppins,sans-serif;border-radius:99px;padding:2px 10px;display:inline-block}
.meta{color:var(--mute);font-size:14px;margin:4px 0 10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{font:600 13px Poppins;border:2px solid var(--ac);background:transparent;color:var(--ac);padding:7px 14px;border-radius:99px;cursor:pointer}
.btn.on{background:var(--bl);border-color:var(--bl);color:var(--on)}
.btn.sm{padding:3px 12px;font-size:12px}
.note{background:var(--pw);color:var(--ink);padding:10px 14px;border-radius:14px;margin:8px 0;font-size:14px}
.empty{text-align:center;color:var(--mute);padding:28px 8px}
.day{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.day b{width:34px;flex:none;font-family:Montserrat,sans-serif}
.day span.z{color:var(--mute)}
input[type=range]{width:100%;accent-color:var(--ac)}
.big{font:700 28px Montserrat,system-ui,sans-serif}
.w{font:inherit;color:inherit;background:none;border:0;border-bottom:2px dotted var(--ac);padding:0;cursor:pointer}
.w.on{background:var(--bl);color:var(--on)}
.s{font-size:18px;line-height:1.6;margin:0 0 4px}
.tr{color:var(--mute);font-size:15px;margin:0 0 14px}
ul,ol{list-style:none;margin:8px 0 0;padding:0}
li{position:relative;padding:4px 0 4px 30px}
ul li::before{content:"";position:absolute;left:4px;top:11px;border-left:12px solid var(--ac);border-top:7px solid transparent;border-bottom:7px solid transparent}
.best li::before{border-left-color:var(--on)}
ul.x li::before,ul.ck li::before{border:0;width:20px;height:20px;border-radius:50%;left:0;top:6px;color:#fff;font:700 12px/20px Poppins;text-align:center}
ul.x li::before{content:"✕";background:#E53935}
ul.ck li::before{content:"✓";background:#2EAD4B}
ol{counter-reset:n}
ol li{counter-increment:n;padding:12px 0 12px 56px}
ol li::before{content:"0" counter(n);position:absolute;left:0;top:50%;transform:translateY(-50%);width:42px;height:42px;border:2px solid var(--bl);border-radius:50%;text-align:center;font:400 15px/38px Montserrat,sans-serif;color:var(--ac)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:4px;background:var(--sf);border-top:1px solid var(--line);box-shadow:0 -8px 16px -12px rgba(12,31,70,.3);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;font:600 11px Poppins;border:0;background:none;color:var(--mute);padding:9px 0;cursor:pointer;border-radius:99px}
nav button.on{background:var(--bl);color:var(--on)}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.hero .acc{position:absolute;right:0;top:30px;background:var(--sf)}
#ov{position:fixed;inset:0;background:rgba(10,18,38,.6);display:none;align-items:flex-end;justify-content:center;z-index:20}
#ov.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:20px 16px calc(24px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto}
input[type=text],input[type=email],input[type=password]{width:100%;padding:11px 14px;border:2px solid var(--bl);border-radius:14px;background:var(--sf);color:var(--ink);font:inherit;margin:2px 0 10px}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:90vw;text-align:center}
#toast.on{opacity:1}
details.card summary{cursor:pointer;font:700 15px Montserrat,sans-serif;color:var(--ac)}
details.card[open] summary{margin-bottom:6px}
.pl{display:grid;grid-template-rows:minmax(0,7fr) minmax(0,3fr);height:min(80vh,600px);background:#000;border-radius:16px;overflow:hidden;border:2px solid var(--bl)}
.pl.full{grid-template-rows:minmax(0,1fr)}
.scr{display:flex;flex-direction:column;justify-content:space-between;background:#000;color:#fff;min-width:0}
.scr .top{display:flex;justify-content:flex-end;align-items:center;gap:8px;padding:10px;font:600 11px Poppins,sans-serif;color:#E8EDFA}
.scr .top .btn{color:#fff;border-color:#fff;flex:none}
.scr .sb{padding:30px 12px 10px;text-align:center;font:600 17px/1.45 Poppins,sans-serif;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.75))}
.scr .bar{height:3px;background:#262626}
.scr .bar i{display:block;height:100%;background:#8FA8F0;transition:width .4s}
.ctl{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px;padding:8px}
.ctl button{min-width:42px;min-height:40px;border:0;border-radius:99px;background:#1f1f1f;color:#fff;font:600 14px Poppins,sans-serif;cursor:pointer}
.ctl button.on{background:var(--bl);color:var(--on)}
.ctl span{color:#DCE4FA;font:12px Poppins,sans-serif}
.lab{background:var(--sf);color:var(--ink);border-top:3px solid var(--bl);padding:12px 14px;overflow:auto;font-size:13.5px;line-height:1.5;min-width:0}
.lab h4{margin:0 0 4px;font:600 10px Poppins,sans-serif;letter-spacing:.8px;text-transform:uppercase;color:var(--ac)}
.lab .t{font-size:15px;font-weight:600;margin-bottom:10px}
.tm{font:600 12.5px Poppins,sans-serif;border:1.5px solid var(--bl);background:none;color:var(--ink);border-radius:99px;padding:3px 11px;margin:0 4px 4px 0;cursor:pointer}
.tm.on{background:var(--bl);color:var(--on)}
.lab .nt{background:var(--tint);border-radius:10px;padding:8px 10px;margin:6px 0 10px}
.lab .btn{flex:1;min-width:120px}
.scr{position:relative}
.fsb{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:12px;border:1px solid rgba(255,255,255,.6);background:rgba(0,0,0,.55);color:#fff;cursor:pointer;z-index:2;display:flex;align-items:center;justify-content:center}
.fsw{position:fixed;inset:0;z-index:25;background:#000;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.fsw .pl{flex:1;height:auto;border:0;border-radius:0}
.fsw .card{position:absolute;left:0;right:0;bottom:0;max-height:55%;overflow:auto;margin:0;border-radius:18px 18px 0 0;z-index:3}
.fsw .scr .sb{font-size:clamp(18px,3.2vw,28px)}
.card h3.pill{color:var(--on)}
.scr,.lab{min-height:0}
.vid{background:linear-gradient(160deg,hsl(var(--h) 40% 32%),hsl(var(--h) 48% 14%))}
.vid svg{width:100%;height:100%;display:block}
.scr>div{position:relative;z-index:1}
.scr>.vid{position:absolute;inset:0;z-index:0}
.mth{transform-box:fill-box;transform-origin:center;transform:scaleY(.35)}
.sp .mth{animation:mth .26s ease-in-out infinite alternate}
.sp .hnd{animation:hnd 1.8s ease-in-out infinite;transform-origin:246px 262px}
.sp .bob{animation:bob 1.1s ease-in-out infinite}
@keyframes mth{to{transform:scaleY(1.25)}}
@keyframes hnd{50%{transform:rotate(-14deg)}}
@keyframes bob{50%{transform:translateY(-2px)}}
@media (prefers-reduced-motion:reduce){.sp .mth,.sp .hnd,.sp .bob{animation:none}}
.ico{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--bl);background:var(--tint);color:var(--ac);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.ls{display:flex;width:100%;gap:10px;align-items:baseline;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);padding:9px 0;font:inherit;cursor:pointer}
.ls span{margin-left:auto;color:var(--mute);font-size:12px;flex:none}
.ls.on b{color:var(--ac)}
details.card summary{font-size:14px}
[dir=rtl] .hero .acc{right:auto;left:0}
[dir=rtl] .pl{direction:ltr}
[dir=rtl] .lab{direction:rtl}
[dir=rtl] li{padding:4px 30px 4px 0}
[dir=rtl] ul li::before{left:auto;right:4px;border-left:0;border-right:12px solid var(--ac)}
[dir=rtl] .best li::before{border-right-color:var(--on)}
[dir=rtl] ul.x li::before,[dir=rtl] ul.ck li::before{right:0;border:0}
[dir=rtl] ol li{padding:12px 56px 12px 0}
[dir=rtl] ol li::before{left:auto;right:0}
[dir=rtl] .ls{text-align:right}
[dir=rtl] .ls span{margin-left:0;margin-right:auto}
</style>
</head>
<body>
<main>
<header class="hero"><i class="r1"></i><i class="r2"></i>
<svg class="logo" viewBox="0 0 150 112" role="img" aria-label="Lingua Pusula logosu" fill="currentColor"><path d="M4 28L10 6L16 28V84H4Z"/><path d="M18 70H126L146 76L126 82H18Z"/><path d="M34 70V46a22 22 0 0 1 44 0V70" fill="none" stroke="currentColor" stroke-width="9"/><text x="4" y="106" font-family="Montserrat,sans-serif" font-size="11" letter-spacing="1.4">LINGUA PUSULA</text></svg>
<button id="acc" class="btn sm acc" data-a="acc">Giriş yap</button><h1>LinguaPusula</h1><p class="tg">Speak your field<span class="beta">beta</span></p></header>
<div id="app"></div>
</main>
<nav id="nav"></nav>
<div id="ov"></div><div id="toast" role="status"></div>
<script>
const LG={'İspanyolca':255,'Fransızca':30,'İngilizce':330,'Almanca':75},LV=['A2','B1','B2','C1'];
const IN={'İspanyolca':'Dr. Lucía Ortega','Fransızca':'Prof. Camille Roux','İngilizce':'Dr. Daniel Hayes','Almanca':'Dr. Katrin Weber'};
const FD={'Siyaset':[['Siyasi sistemler',6],['Uluslararası ilişkiler',8],['Diplomasi dili',10]],
'Finans':[['Temel kavramlar',6],['Piyasalar ve yatırım',8],['Şirket raporları',10]],
'Gastronomi':[['Mutfak ve menü dili',6],['Tarifler ve teknikler',8],['Restoran işletmeciliği',10]],
'Hukuk':[['Hukuka giriş',6],['Sözleşme dili',8],['Uluslararası hukuk',10]]};
const PRE=[{lang:'Fransızca',field:'Gastronomi',level:'A2'},{lang:'İspanyolca',field:'Finans',level:'B2'},{lang:'İngilizce',field:'Siyaset',level:'B1'}];
const GL={'inflación':'enflasyon','aumento sostenido':'sürekli artış','precios':'fiyatlar','poder adquisitivo':'satın alma gücü','ahorros':'birikimler','bancos centrales':'merkez bankaları','tipos de interés':'faiz oranları','frenar':'frenlemek, yavaşlatmak','demanda':'talep'};
const TIP={'tipos de interés':'İspanya\'da "tipo de interés", Latin Amerika\'da çoğunlukla "tasa de interés" denir.','inflación':'Enflasyon göstergesi: IPC (índice de precios al consumidor), yani TÜFE.','poder adquisitivo':'"Adquisitivo", "adquirir" (edinmek) fiilinden gelir. B2 yazılı metinlerde sık geçer.'};
const SN=[['La inflación es el aumento sostenido de los precios en una economía.','Enflasyon, bir ekonomide fiyatların sürekli artmasıdır.'],
['Cuando los precios suben, el poder adquisitivo de los ahorros disminuye.','Fiyatlar yükseldiğinde birikimlerin satın alma gücü azalır.'],
['Los bancos centrales suben los tipos de interés para frenar la demanda.','Merkez bankaları talebi yavaşlatmak için faiz oranlarını artırır.']];
const RX=new RegExp('('+Object.keys(GL).sort((a,b)=>b.length-a.length).join('|')+')','i');
const DAYS=['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'],ORD=[0,2,4,1,3,5,6];
let s={tab:'k',lang:'İspanyolca',field:'Finans',level:'B2',prog:[],wk:6,live:0,tr:false,w:''};
try{const o=JSON.parse(localStorage.getItem('lp-beta'));if(o)s=Object.assign(s,o)}catch(e){}
const $=id=>document.getElementById(id);
const eur=n=>'€'+(Math.round(n*10)/10).toString().replace('.',',');
const hrs=e=>FD[e.field][e.i][1];
const coins=e=>hrs(e)*(e.mode==='live'?40:10);
const nm=e=>e.lang+' · '+e.field+': '+FD[e.field][e.i][0];
const find=(l,f,i,v)=>s.prog.findIndex(e=>e.lang===l&&e.field===f&&e.i===i&&e.level===v);
const chips=(k,a)=>'<div class="chips">'+a.map(v=>`<button class="chip${s[k]===v?' on':''}" data-a="set" data-k="${k}" data-v="${v}">${v}</button>`).join('')+'</div>';
function stats(){const h=s.prog.reduce((t,e)=>t+hrs(e),0),c=s.prog.reduce((t,e)=>t+coins(e),0);return{h,c,wks:Math.max(1,Math.ceil(h/s.wk))}}

function vK(){
 let h='<h2>Hedefini seç</h2><div class="lb">Dil</div>'+chips('lang',Object.keys(LG))+'<div class="lb">Alan</div>'+chips('field',Object.keys(FD))+'<div class="lb">Seviye</div>'+chips('level',LV)+'<h2>Kurslar</h2>';
 FD[s.field].forEach(([n,t],i)=>{const k=find(s.lang,s.field,i,s.level),m=k>=0?s.prog[k].mode:'';
  h+=`<div class="card"><h3>${n}</h3><p class="meta">${s.lang} · ${s.level} · ${t} saat · ${IN[s.lang]} (örnek eğitmen)</p><div class="row">
  <button class="btn${m==='video'?' on':''}" data-a="tog" data-i="${i}" data-m="video">Video · ${t*10} coin</button>
  <button class="btn${m==='live'?' on':''}" data-a="tog" data-i="${i}" data-m="live">Birebir ders · ${t*40} coin</button></div></div>`});
 return h+'<p class="sub">Eklediğin kurslar "Program" sekmesinde birleşir.</p>'}

function vP(){
 if(!s.prog.length)return '<h2>Programım</h2><div class="empty">Programın boş.<br>Keşfet sekmesinden en az bir kurs ekle.<p><button class="btn" data-a="tab" data-v="k">Kurs seç</button></p></div>';
 const st=stats(),q=[...s.prog].sort((a,b)=>a.field.localeCompare(b.field)||a.i-b.i);
 let h='<h2>Programım</h2>'+s.prog.map((e,k)=>`<div class="card row" style="justify-content:space-between"><div><b>${FD[e.field][e.i][0]}</b><div class="meta" style="margin:0">${e.lang} · ${e.level} · ${hrs(e)} saat · ${e.mode==='live'?'birebir':'video'}</div></div><button class="btn sm" data-a="del" data-k="${k}">Çıkar</button></div>`).join('');
 h+=`<div class="lb">Haftalık çalışma süresi: <b>${s.wk} saat</b></div><input type="range" min="2" max="14" value="${s.wk}" id="wk" aria-label="Haftalık saat">
 <p class="meta">Toplam ${st.h} saat · yaklaşık ${st.wks} hafta · ${st.c} coin</p><div class="card"><div class="row" style="justify-content:space-between"><div><b>${st.c} coin</b><div class="meta" style="margin:0">${me()?`Bakiyen: ${cf(me().coins)} coin`:'Satın almak için giriş yap'}</div></div><button class="btn on" data-a="buyprog">Coinle satın al</button></div></div><h2>İlk hafta planı</h2>`;
 const used=Math.min(s.wk,7),base=Math.floor(s.wk/used),rem=s.wk%used,per=Array(7).fill(0);
 ORD.slice(0,used).forEach((d,j)=>per[d]=base+(j<rem?1:0));
 let qi=0,left=q.length?hrs(q[0]):0;
 per.forEach((p,d)=>{let t=[];while(p>0&&qi<q.length){const u=Math.min(p,left);t.push(FD[q[qi].field][q[qi].i][0]+' ('+u+' sa)');p-=u;left-=u;if(left===0){qi++;left=qi<q.length?hrs(q[qi]):0}}
  h+=`<div class="day"><b>${DAYS[d]}</b><span class="${t.length?'':'z'}">${t.length?t.join(' + '):'Dinlenme'}</span></div>`});
 const fl=new Set(s.prog.map(e=>e.field)).size,ll=new Set(s.prog.map(e=>e.lang)).size,la=s.prog[s.prog.length-1];
 h+='<h2>Koç notları</h2>';
 if(ll>1)h+='<div class="note">Birden fazla dili aynı anda almak ilerlemeyi yavaşlatır. Önce bir dile odaklan.</div>';
 if(fl>2)h+='<div class="note">Aynı anda 2\'den fazla alan var. Bir alanı sonraki döneme bırak.</div>';
 if(s.wk<4)h+='<div class="note">Haftada 4 saatin altında, seviye atlamak uzun sürer. Süreyi artırmayı dene.</div>';
 const nx=FD[la.field].findIndex((_,i)=>find(la.lang,la.field,i,la.level)<0);
 if(nx>=0)h+=`<div class="note">Sıradaki uyumlu kurs: <b>${FD[la.field][nx][0]}</b> (${la.lang} · ${la.level}). <button class="btn sm" data-a="sug" data-i="${nx}">Ekle</button></div>`;
 else if(ll<=1&&fl<=2&&s.wk>=4)h+='<div class="note">Sıralama uyumlu. Bu alandaki tüm modüller programında.</div>';
 h+=`<div class="note">Programı bitirince CV ve LinkedIn profiline ekleyebileceğin bir Lingua Pusula sertifikası alırsın.</div>`;
 return h}

const FRS=[
{fr:`Demain, je vais aller à l'école de commerce.`,tr:`Yarın ticaret okuluna gideceğim.`,
 t:[[`vais`,`aller fiilinin je ile çekimi. Yakın gelecek için yardımcı fiil görevinde.`],[`aller`,`Mastar. Cümlenin ana fiili: gitmek.`],[`à l'école`,`à + école: okula. l' = la, ünlüden önce kısalır.`]],
 d:[`<b>Neden vais?</b> Yakın gelecek (futur proche) şöyle kurulur: aller fiilinin şimdiki zaman çekimi + mastar. Je vais, tu vas, il va, nous allons, vous allez, ils vont. Burada vais yalnızca "-ecek" anlamını veren yardımcıdır.`,`<b>Neden aller?</b> Yardımcıdan sonra gelen ana fiil çekimlenmez, mastar kalır. Ana fiil de "gitmek" olduğu için aller iki kez geçer: vais (yardımcı) + aller (ana fiil).`,`<b>Karşılaştır:</b> Je vais à l'école = okula gidiyorum. Je vais aller à l'école = okula gideceğim.`]},
{fr:`Il faut que j'aille à l'école avant que le cours commence.`,tr:`Ders başlamadan önce okula gitmem gerekiyor.`,
 t:[[`il faut que`,`Zorunluluk kalıbı. Ardından subjonctif gelir.`],[`j'aille`,`aller fiilinin subjonctif présent çekimi (que j'aille).`],[`avant que`,`-meden önce. Ardından subjonctif gelir.`],[`commence`,`commencer, subjonctif présent.`]],
 d:[`<b>Neden aille, vais değil?</b> Il faut que'den sonra fiil subjonctif'e geçer. aller'nin subjonctif'i düzensizdir: que j'aille, tu ailles, il aille, nous allions, vous alliez, ils aillent.`,`<b>Neden avant que + commence?</b> avant que her zaman subjonctif ister. -er fiillerinde il/je biçimi indicatif ile aynı görünür (commence), ama kural yine subjonctif'tir.`,`<b>İpucu:</b> Özne aynıysa mastar kullanılır: avant d'aller (gitmeden önce). Özne farklıysa avant que + subjonctif.`]},
{fr:`Bien que ce soit difficile, je ne renonce pas.`,tr:`Zor olsa da vazgeçmiyorum.`,
 t:[[`bien que`,`-e rağmen. Ardından subjonctif gelir.`],[`soit`,`être fiilinin subjonctif'i (que ce soit).`],[`ne ... pas`,`Olumsuzluk kalıbı, renonce fiilini sarar.`]],
 d:[`<b>Neden soit?</b> bien que karşıtlık bağlacıdır ve subjonctif ister. être'in subjonctif présent'i: que je sois, tu sois, il soit, nous soyons, vous soyez, ils soient.`,`<b>Ana cümle neden indicatif?</b> Kuralın etkisi yalnızca bien que'den sonraki yan cümledeki fiilde görülür. je ne renonce pas normal şimdiki zamandır.`,`<b>Karşılaştır:</b> parce que + indicatif (sebep), bien que + subjonctif (karşıtlık).`]},
{fr:`Si j'avais su, je serais venu plus tôt.`,tr:`Bilseydim daha erken gelirdim.`,
 t:[[`j'avais su`,`plus-que-parfait: avoir (imparfait) + su (savoir'ın ortacı).`],[`je serais venu`,`conditionnel passé: être (conditionnel) + venu.`],[`plus tôt`,`Daha erken.`]],
 d:[`<b>Yapı:</b> Geçmişte gerçekleşmemiş koşul: si + plus-que-parfait, conditionnel passé.`,`<b>Neden serais venu?</b> venir, être ile çekimlenen hareket fiillerindendir. Bu yüzden ortaç özneye uyar: elle serait venue, nous serions venus.`,`<b>Sık hata:</b> si'den sonra conditionnel kullanılmaz. Si j'aurais su yanlıştır, Si j'avais su doğrudur.`]},
{fr:`Le professeur dont je t'ai parlé donne un cours ce soir.`,tr:`Sana bahsettiğim öğretmen bu akşam ders veriyor.`,
 t:[[`dont`,`"de" içeren yapının yerini tutan ilgi zamiri (parler de).`],[`je t'ai parlé`,`passé composé. t' = te (sana).`],[`donne un cours`,`Ders vermek.`]],
 d:[`<b>Neden dont?</b> parler de quelqu'un yapısındaki "de" zamirin içine girer: le professeur dont je parle. dont'tan sonra doğrudan özne gelir.`,`<b>Tekrar etme:</b> "de" zaten dont içinde olduğu için tekrar konmaz. Le professeur dont je t'ai parlé doğru, ... parlé de lui yanlıştır.`,`<b>t' kim?</b> parler à quelqu'un yapısında muhatap te/t' olur. Bahsedilen kişi dont, muhatap t'.`]}];
const LN={fr:'Fransızca',es:'İspanyolca',en:'İngilizce',de:'Almanca',it:'İtalyanca'},SL={fr:'fr-FR',es:'es-ES',en:'en-GB',de:'de-DE',it:'it-IT'};
const ml=(l,lv,f,ti,bd,s,t,d,hh)=>{const T=t.split('|').map(x=>x.split('=')),D=[d];return{l,lv,f,ti,bd:bd.split('|'),s:s.split('|').map(x=>{const a=x.split('~');return{fr:a[0],tr:a[1],t:T,d:D}}),h:hh.split('~')}};
const LSN=[{l:'fr',per:1,lv:'B2',f:'Dilbilgisi',ti:'Subjonctif ve koşullar',bd:['Le subjonctif','Il faut que…','Bien que…'],s:FRS,h:['subjonctif','Adı Latince "subiunctivus" (bağlanmış) sözcüğünden gelir; kip genellikle başka bir fiile bağlı yan cümlelerde kullanıldığı için bu adı almıştır.']},
ml('es','B2','Finans','Enflasyon nedir?',`La inflación|Precios ↑|Poder adquisitivo ↓`,`La inflación es el aumento sostenido de los precios en una economía.~Enflasyon, bir ekonomide fiyatların sürekli artmasıdır.|Cuando suben los precios, el poder adquisitivo de los ahorros disminuye.~Fiyatlar yükseldiğinde birikimlerin satın alma gücü azalır.`,`inflación=enflasyon|poder adquisitivo=satın alma gücü`,`<b>inflación</b>: genel fiyat düzeyindeki sürekli artış. Göstergesi İspanyolcada IPC (índice de precios al consumidor), yani TÜFE. <b>poder adquisitivo</b>: aynı parayla alınabilen mal miktarı.`,`inflación~16. yüzyılda Salamanca Okulu'ndan Martín de Azpilcueta, Amerika'dan gelen gümüşün paranın değerini düşürdüğünü yazdı. Bu, para miktarı ile fiyatlar arasındaki ilişkinin erken bir tartışmasıdır.`),
ml('en','B2','Hukuk','Sözleşme ihlali',`Breach of contract|Remedies|Damages`,`A breach of contract occurs when one party fails to perform its obligations.~Taraflardan biri yükümlülüklerini yerine getirmediğinde sözleşme ihlali olur.|The injured party may claim damages or ask for specific performance.~Zarar gören taraf tazminat isteyebilir ya da aynen ifa talep edebilir.`,`breach of contract=sözleşme ihlali|damages=tazminat`,`<b>damages</b> hukukta tazminat demektir ve her zaman çoğul kullanılır; tekil damage yalnızca "hasar" anlamına gelir. <b>specific performance</b>: mahkemenin tazminat yerine sözleşmenin aynen yerine getirilmesine karar vermesi.`,`damages~Common law mahkemelerinde tazminat ilkeleri yüzyıllar içinde içtihatla şekillendi. 1854 tarihli Hadley v Baxendale davası, öngörülebilir zarar ilkesiyle bugün hâlâ temel kaynaktır.`),
ml('de','B1','Mühendislik','Yenilenebilir enerji',`Erneuerbare Energie|Wind · Sonne · Wasser|Netzstabilität`,`Windkraftanlagen wandeln Bewegungsenergie in Strom um.~Rüzgâr enerjisi santralleri hareket enerjisini elektriğe dönüştürür.|Die Energiewende soll den CO₂-Ausstoß senken.~Enerji dönüşümü karbondioksit salımını azaltmayı hedefliyor.`,`Windkraftanlage=rüzgâr enerjisi santrali|Energiewende=enerji dönüşümü`,`<b>Windkraftanlage</b> bileşik sözcüktür: Wind (rüzgâr) + Kraft (güç) + Anlage (tesis). Almancada uzun teknik terimler böyle kurulur. <b>Energiewende</b> dişildir: die Energiewende.`,`Energiewende~Terim, 1980'de Öko-Institut'un yayımladığı bir çalışmayla yaygınlaştı. Almanya'da yenilenebilir enerjiyi destekleyen yasa 2000 yılında çıktı.`),
ml('fr','B1','Gastronomi','Mutfak brigadı',`La brigade de cuisine|Chef · Sous-chef · Commis|Mise en place`,`Le chef de cuisine dirige toute la brigade.~Mutfak şefi tüm brigadı yönetir.|Avant le service, chaque commis termine sa mise en place.~Servisten önce her commis mise en place hazırlığını bitirir.`,`brigade de cuisine=mutfak brigadı|mise en place=servis öncesi hazırlık`,`<b>mise en place</b> kelimesi kelimesine "yerine koyma" demektir: malzeme doğranır, tartılır ve servise hazır dizilir. <b>commis</b> şefin altındaki çırak seviyesidir.`,`brigade de cuisine~Modern mutfak brigadı sistemini 19. yüzyılın sonu ile 20. yüzyılın başında Auguste Escoffier düzenledi. Görevleri bölümlere ayıran bu yapı restoran mutfaklarında hâlâ kullanılıyor.`),
ml('es','B1','Siyaset','Seçim sistemleri',`Sistema electoral|Voto directo|Representación`,`En una democracia, los ciudadanos eligen a sus representantes mediante el voto.~Demokraside vatandaşlar temsilcilerini oy yoluyla seçer.|El sistema electoral define cómo los votos se convierten en escaños.~Seçim sistemi oyların sandalyeye nasıl dönüştüğünü belirler.`,`sistema electoral=seçim sistemi|escaño=parlamentoda koltuk`,`<b>escaño</b>: parlamentodaki milletvekili koltuğu. <b>representación proporcional</b>: koltuklar oy oranına göre dağıtılır; karşıtı çoğunluk sistemidir.`,`sistema electoral~Oyları koltuğa çeviren D'Hondt yöntemi, Belçikalı hukukçu Victor D'Hondt'un adını taşır. İspanya da milletvekili seçiminde bu yöntemi kullanır.`),
ml('en','B2','Tıp','Triyaj',`Triage|Priority · Vital signs|Emergency department`,`In the emergency department, nurses triage patients by the severity of their condition.~Acil serviste hemşireler hastaları durumlarının ciddiyetine göre sınıflandırır.|The most critical cases are treated first.~En kritik vakalar önce tedavi edilir.`,`triage=aciliyete göre sınıflandırma|vital signs=yaşamsal belirtiler`,`<b>triage</b> isim ve fiil olarak kullanılır: to triage patients. <b>vital signs</b>: nabız, tansiyon, vücut sıcaklığı ve solunum sayısı; triyajın ilk ölçütleridir.`,`triage~Sözcük Fransızca "trier" (ayıklamak) fiilinden gelir. Yaralıları aciliyete göre sıralama fikri, Napolyon savaşlarında cerrah Dominique Jean Larrey ile ilişkilendirilir.`),
ml('de','B1','Ekonomi','Orta ölçekli işletmeler',`Der Mittelstand|Familienunternehmen|Export`,`Der Mittelstand besteht aus vielen kleinen und mittleren Unternehmen.~Mittelstand, çok sayıda küçük ve orta ölçekli işletmeden oluşur.|Viele dieser Firmen sind Familienunternehmen und exportieren weltweit.~Bu firmaların çoğu aile şirketidir ve dünya çapında ihracat yapar.`,`Mittelstand=KOBİ çekirdeği|Familienunternehmen=aile şirketi`,`<b>Mittelstand</b> (der): Almanya'da özellikle sanayi ve ihracatta öne çıkan küçük ve orta ölçekli işletmeler. <b>Familienunternehmen</b> = Familie + Unternehmen.`,`Mittelstand~Sözcük Almancada "orta sınıf" anlamına da gelir; bugün ekonomide küçük ve orta ölçekli, çoğu aile işletmesi olan firmaları anlatır.`),
ml('en','B1','Bilişim','Bulut bilişim',`Cloud computing|Servers · Storage|Pay as you go`,`Cloud computing lets companies rent servers instead of buying them.~Bulut bilişim şirketlerin sunucu satın almak yerine kiralamasını sağlar.|They pay only for the storage and power they use.~Yalnızca kullandıkları depolama ve işlem gücü için öderler.`,`cloud computing=bulut bilişim|storage=depolama`,`<b>pay as you go</b>: kullandığın kadar öde; bulut hizmetlerinin temel fiyatlama mantığı. <b>server</b>: sunucu; bulutta bu bilgisayarlar veri merkezlerinde durur.`,`cloud computing~Ağ şemalarında internet bir bulut simgesiyle gösterilirdi, "bulut" adı buradan yerleşti. Amazon Web Services'in 2006'da kiralık sunucu hizmetini sunmasıyla kavram yaygınlaştı.`),
ml('fr','B2','Mimarlık','Betonarme',`Le béton armé|Fondations|Façade`,`Le béton armé combine la résistance de l'acier et celle du béton.~Betonarme, çeliğin ve betonun dayanımını birleştirir.|L'ingénieur calcule les fondations avant de couler le béton.~Mühendis betonu dökmeden önce temelleri hesaplar.`,`béton armé=betonarme|fondations=temel`,`<b>fondations</b> mimarlıkta hep çoğuldur. <b>avant de + mastar</b>: aynı özne iki eylemi yapıyorsa kullanılır: avant de couler (dökmeden önce).`,`béton armé~Betonarme sistemi 19. yüzyıl sonunda Fransız mühendis François Hennebique geliştirdi ve 1892'de patentledi.`),
ml('es','B1','Pazarlama','Marka ve konumlandırma',`La marca|Público objetivo|Posicionamiento`,`Una marca fuerte genera confianza en el público objetivo.~Güçlü bir marka hedef kitlede güven yaratır.|El posicionamiento define el lugar de la marca en la mente del cliente.~Konumlandırma, markanın müşterinin zihnindeki yerini belirler.`,`público objetivo=hedef kitle|posicionamiento=konumlandırma`,`<b>público objetivo</b>: ürünün ulaşmak istediği kitle. <b>-miento</b> eki fiilden isim türetir: posicionar → posicionamiento.`,`posicionamiento~Konumlandırma kavramı 1969'da Jack Trout'un yazısıyla ortaya çıktı, 1981'de Al Ries ve Trout'un "Positioning" kitabıyla yayıldı.`),
ml('en','B2','Psikoloji','Bilişsel yanlılık',`Cognitive bias|Heuristics|Decision-making`,`Cognitive biases are systematic errors in how we process information.~Bilişsel yanlılıklar bilgiyi işleme biçimimizdeki sistematik hatalardır.|Confirmation bias makes us favour evidence that supports what we already believe.~Doğrulama yanlılığı, zaten inandığımızı destekleyen kanıtları tercih ettirir.`,`cognitive bias=bilişsel yanlılık|confirmation bias=doğrulama yanlılığı`,`<b>systematic</b>: rastgele değil, aynı yönde tekrarlayan; yanlılığı sıradan hatadan ayırır. <b>favour</b> İngiliz yazımıdır, Amerikan yazımı favor.`,`cognitive bias~Terim 1970'lerde Amos Tversky ve Daniel Kahneman'ın karar verme araştırmalarıyla psikolojiye yerleşti.`),
ml('de','B2','Hukuk','Kira sözleşmesi',`Der Mietvertrag|Kündigungsfrist|Kaution`,`Der Mietvertrag legt die Rechte und Pflichten von Mieter und Vermieter fest.~Kira sözleşmesi kiracı ile kiraya verenin hak ve yükümlülüklerini belirler.|Für Mieter beträgt die Kündigungsfrist in der Regel drei Monate.~Kiracılar için fesih süresi genellikle üç aydır.`,`Kündigungsfrist=fesih süresi|Kaution=kira güvencesi (depozito)`,`<b>Kündigungsfrist</b> bileşik sözcüktür: Kündigung (fesih) + Frist (süre). <b>Mieter</b> kiracı, <b>Vermieter</b> evi kiraya verendir; ikisi sık karıştırılır.`,`Mietvertrag~Almanya'da kira ilişkisi Medeni Kanun'da (BGB) düzenlenir; BGB 1900'de yürürlüğe girdi.`),
ml('en','B1','Havacılık','Hava trafik kontrolü',`Air traffic control|Runway · Taxiway|Clearance`,`The controller gives the aircraft clearance to take off.~Kontrolör uçağa kalkış izni verir.|Pilots must read back important instructions.~Pilotlar önemli talimatları geri okumak zorundadır.`,`clearance=(uçuş) izni|runway=pist`,`<b>clearance</b> havacılıkta kontrolörün verdiği resmi izindir: take-off clearance, landing clearance. <b>read back</b>: alınan talimatı sözlü olarak tekrarlamak.`,`air traffic control~Havacılıkta telsizle trafik yönlendirme 1920'lerde başladı. Uluslararası Sivil Havacılık Örgütü (ICAO) 1947'de çalışmaya başladı ve ortak kuralları belirler.`),
ml('fr','B1','Moda','Haute couture',`La haute couture|Atelier · Collection|Défilé`,`Les maisons de haute couture présentent deux collections par an.~Haute couture evleri yılda iki koleksiyon sunar.|Chaque pièce est cousue à la main dans un atelier.~Her parça bir atölyede elle dikilir.`,`haute couture=yüksek moda|défilé=defile`,`<b>haute couture</b> kelimesi kelimesine "yüksek dikiş" demektir; her parça müşteriye özel hazırlanır. <b>cousue</b>: coudre (dikmek) fiilinin dişil ortacı, çünkü pièce dişildir.`,`haute couture~Haute couture'ün başlangıcı 19. yüzyılda Paris'te çalışan İngiliz Charles Frederick Worth'a bağlanır. Fransa'da bu ad belirli ölçütlere bağlı, korunan bir ünvandır.`),
ml('it','B1','Sanat tarihi','Chiaroscuro',`Il chiaroscuro|Luce e ombra|Rinascimento`,`Il chiaroscuro usa il contrasto tra luce e ombra per dare volume alle figure.~Chiaroscuro, figürlere hacim vermek için ışık ve gölge karşıtlığını kullanır.|Caravaggio è famoso per i suoi forti contrasti di luce.~Caravaggio güçlü ışık karşıtlıklarıyla ünlüdür.`,`chiaroscuro=ışık-gölge tekniği|contrasto=karşıtlık`,`<b>chiaroscuro</b> iki sözcüğün birleşimidir: chiaro (açık) + scuro (koyu). <b>volume</b>: resimde derinlik ve hacim izlenimi.`,`chiaroscuro~Teknik Rönesans'ta gelişti. Leonardo da Vinci yumuşak geçişlerle kullandı, Caravaggio 1600 civarında sert ve dramatik biçimde öne çıkardı.`),
ml('en','B2','Finans','Merkez bankası ve faiz',`Central bank|Interest rate|Monetary policy`,`The central bank raises interest rates to curb inflation.~Merkez bankası enflasyonu dizginlemek için faiz oranlarını artırır.|Higher rates make borrowing more expensive for businesses.~Yüksek faiz, işletmeler için borçlanmayı pahalılaştırır.`,`interest rate=faiz oranı|monetary policy=para politikası`,`<b>to curb</b>: dizginlemek; haberlerde "curb inflation" kalıbı sık geçer. <b>borrowing</b>: borçlanma; kredi alan borrower, veren lender'dır.`,`central bank~Bank of England 1694'te kuruldu ve ilk merkez bankalarından biri sayılır.`),
ml('es','B1','Turizm','Otel rezervasyonu',`La reserva|Habitación doble|Check-in`,`Quisiera reservar una habitación doble para tres noches.~Üç gecelik bir çift kişilik oda ayırtmak istiyorum.|El desayuno está incluido en el precio.~Kahvaltı fiyata dahildir.`,`reservar=rezervasyon yapmak|incluido=dahil`,`<b>quisiera</b> kibar rica kalıbıdır (querer fiilinin subjuntivo biçimi): "quiero"dan daha nazik. <b>incluido</b> dahil demektir; dişil ve çoğulda değişir: incluida, incluidos.`,`reserva~Bilgisayarlı rezervasyon sistemleri 1960'larda havayollarında doğdu (Sabre) ve sonra otellere yayıldı.`),
ml('de','B2','Tasarım','Bauhaus',`Das Bauhaus|Form folgt Funktion|Weimar · Dessau`,`Das Bauhaus verband Kunst, Handwerk und Technik.~Bauhaus sanatı, zanaatı ve tekniği birleştirdi.|Die Schule wurde 1919 in Weimar gegründet.~Okul 1919'da Weimar'da kuruldu.`,`Bauhaus=tasarım okulu ve akımı|Handwerk=zanaat`,`<b>wurde gegründet</b>: edilgen geçmiş zaman (Passiv Präteritum): werden + Partizip II, "kuruldu". <b>Form folgt Funktion</b>: biçim işlevi izler; modern tasarımın temel ilkesi.`,`Bauhaus~Walter Gropius 1919'da Weimar'da kurdu. Okul Dessau'ya, sonra Berlin'e taşındı ve 1933'te kapandı.`),
ml('en','B1','Gazetecilik','Haber yazımı',`Journalism|Headline · Lead|Verify the source`,`A good headline summarises the story in a few words.~İyi bir başlık haberi birkaç kelimeyle özetler.|Journalists must always verify their sources.~Gazeteciler kaynaklarını her zaman doğrulamalıdır.`,`headline=manşet, başlık|verify=doğrulamak`,`<b>lead</b> (ya da lede) haberin ilk paragrafıdır; kim, ne, nerede, ne zaman ve neden sorularını yanıtlar. <b>source</b>: kaynak.`,`lead~Önemli bilgiyi başa koyan ters piramit düzeni, telgrafla haber iletiminin yaygınlaştığı 19. yüzyılda gelişti diye anlatılır.`)];

const PA=['pp','nx','pv','lab','tm','dt','hs','snd','fs','ai'],cur=()=>LSN[PL.k],sn=()=>cur().s;
const SK=['#F1C9A5','#D9A47A','#B9805A','#8D5A3C'],HR=['#2B2118','#5A3A22','#1B1B1B','#8A8A8A','#9C5A2B'],SH=['#344E9C','#2F7D6B','#7A3E8E','#B5473C','#2D5F8A','#444B5C'];
function scene(k,i){
 const q=LSN[k],b=q.bd,sk=SK[k%4],hr=HR[k%5],sh=SH[k%6],gl=k%3===0;
